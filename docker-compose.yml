# Local Postgres for the Shuddha backend.
#   Bring up:   docker compose up -d
#   Tear down:  docker compose down          (add -v to also drop the volume/data)
# Values here match apps/suddh-bharat-backend/.env (DATABASE_URL).
services:
  postgres:
    image: postgres:17-alpine
    container_name: shuddha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shuddha
      POSTGRES_PASSWORD: shuddha
      POSTGRES_DB: shuddha
    # Host 5436 → container 5432 (5432–5435 are commonly taken by other local DBs).
    ports:
      - '5436:5432'
    volumes:
      - shuddha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shuddha -d shuddha']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis: shared store for the rate-limiter (and future shared caches) so limits
  # hold ACROSS instances. Host 6380 → container 6379 (6379 is often taken).
  redis:
    image: redis:7-alpine
    container_name: shuddha-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shuddha_pgdata:
